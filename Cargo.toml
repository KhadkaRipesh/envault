[package]
name = "envault-cli"
version = "0.1.1"
edition = "2021"
description = "Local-first encrypted secrets manager for Rust projects"
license = "MIT"
repository = "https://github.com/KhadkaRipesh/envault"
homepage = "https://github.com/KhadkaRipesh/envault"
keywords = ["secrets", "env", "encryption", "dotenv", "security"]
categories = ["command-line-utilities", "cryptography"]
readme = "README.md"

[[bin]]
name = "envault"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Crypto
argon2 = { version = "0.5" }
chacha20poly1305 = "0.11"
zeroize = "1.8"
hybrid-array = "0.4"
secrecy = "0.8"

# Config / serialization
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encoding / randomness
base64 = "0.22"
rand = "0.8"

# Password input
rpassword = "7"

# Helpers
thiserror = "1"
anyhow = "1"

[profile.release]
opt-level = 3
